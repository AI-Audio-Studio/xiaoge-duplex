name: CI

# 轻量 CI,贴合本工程实际:只做不依赖外部服务/音频设备的静态检查——
# ruff 代码规范 + 格式检查 + 字节编译(语法)检查,范围限定为小歌应用代码
# examples/voice_agents(框架 livekit-agents 为上游代码,不在此校验)。
# 完整对话/录音是端到端的,需要 Qwen/FunASR/百炼 端点和麦克风,无法在 CI 跑。

on:
  push:
    branches: [main]
    paths:
      - "examples/voice_agents/**"
      - "clients/**"
      - "ourcode.txt"
      - "ruff-ours.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "examples/voice_agents/**"
      - "clients/**"
      - "ourcode.txt"
      - "ruff-ours.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint-compile:
    name: Lint & byte-compile (examples/voice_agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.15.18
      - name: Ruff lint
        run: ruff check examples/voice_agents
      - name: Ruff lint (our code, strict — docs/project/CODE_GUIDELINES.md)
        run: ruff check --config ruff-ours.toml $(cat ourcode.txt)
      - name: Ruff format check
        run: ruff format --check examples/voice_agents clients/python clients/matlab/bridge
      - name: Byte-compile (syntax check)
        run: python -m compileall -q examples/voice_agents clients/python clients/matlab/bridge

  c-build:
    name: C SDK build (libwebsockets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libwebsockets + cmake
        run: sudo apt-get update && sudo apt-get install -y libwebsockets-dev cmake build-essential
      - name: Build clients/c
        run: |
          cmake -S clients/c -B clients/c/build
          cmake --build clients/c/build
      # 端到端冒烟:用编译好的 C 二进制连真机(wss 自签),发 1s 静音,收欢迎语 TTS。
      # 非阻塞(continue-on-error):依赖外部服务器,不作为门禁——符合"测试不影响正常流程"。
      - name: E2E smoke vs live server (non-gating)
        continue-on-error: true
        run: |
          echo "== reachability from runner =="
          curl -k -sS -m 10 -o /dev/null -w "https GET -> code=%{http_code} time=%{time_total}s\n" https://60.205.197.165:10099/ || echo "curl failed rc=$?"
          python3 - <<'PY'
          import socket, time
          t = time.time()
          try:
              socket.create_connection(("60.205.197.165", 10099), timeout=10).close()
              print("TCP connect OK %.2fs" % (time.time() - t))
          except Exception as e:
              print("TCP connect FAIL:", repr(e))
          PY
          echo "== python SDK e2e (control) =="
          pip install -q websockets
          python3 - <<'PY'
          import asyncio, ssl, wave
          import websockets
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          async def main():
              try:
                  async with websockets.connect("wss://60.205.197.165:10099/ws/audio", ssl=ctx, open_timeout=10) as ws:
                      print("py first frame:", await asyncio.wait_for(ws.recv(), 8))
              except Exception as e:
                  print("py connect FAIL:", repr(e))
          asyncio.run(main())
          PY
          echo "== C demo =="
          python3 - <<'PY'
          import wave
          with wave.open('/tmp/probe.wav', 'wb') as w:
              w.setframerate(16000); w.setnchannels(1); w.setsampwidth(2)
              w.writeframes(b'\x00\x00' * 16000)  # 1s 静音
          PY
          ./clients/c/build/xiaoge_demo_file 60.205.197.165 10099 /tmp/probe.wav /tmp/reply.wav --tls --insecure | tee /tmp/out.txt
          grep -q "ready" /tmp/out.txt && echo "handshake(ready) OK" || echo "no ready"
