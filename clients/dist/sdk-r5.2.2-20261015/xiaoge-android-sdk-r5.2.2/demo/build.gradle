plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def xiaogeApiKey = localProperties.getProperty("XIAOGE_API_KEY", "")
def escapedXiaogeApiKey = xiaogeApiKey.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace "com.xiaoge.client.demo"
    compileSdk 35

    defaultConfig {
        applicationId "com.xiaoge.client.demo"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0-r5.2.2"
        buildConfigField "String", "XIAOGE_API_KEY", "\"${escapedXiaogeApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('../aar/xiaoge-sdk-core-release.aar')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.json:json:20240303"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
}
