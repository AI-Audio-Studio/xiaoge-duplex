    <text x="648" y="1650" text-anchor="start" font-size="12" font-weight="400" fill="#334155" opacity="1"><tspan x="648" dy="0">休眠时保持 WSS，GUI 同时显示 link_state=connected 与 mode=休眠；后级 ASR/LLM 门控</tspan><tspan x="648" dy="17">关闭。</tspan></text>
    <g>
