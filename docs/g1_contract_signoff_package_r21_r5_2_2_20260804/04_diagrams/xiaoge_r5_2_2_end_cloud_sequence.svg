  </g><g>
    <path d="M 1360 900 L 390 900" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="875" y="876" text-anchor="middle" font-size="11" font-weight="400" fill="#172033" opacity="1"><tspan x="875" dy="0">M11a 多命令 ask_split</tspan><tspan x="875" dy="15">仅 data.reply；无 cmd</tspan><tspan x="875" dy="15">FR-CMD-003</tspan></text>
