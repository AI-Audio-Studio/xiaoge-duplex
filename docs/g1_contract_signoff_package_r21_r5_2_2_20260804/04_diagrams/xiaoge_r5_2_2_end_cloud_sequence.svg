    <text x="92" y="1650" text-anchor="start" font-size="12" font-weight="400" fill="#334155" opacity="1"><tspan x="92" dy="0">端侧执行模块画在端侧区域，不属于本工程实现；小歌只通过协议输出 data.cmd 并接收 ack </tspan><tspan x="92" dy="17">与 result。</tspan></text>
    <g>
    <rect x="266" y="1704" width="63.99999999999999" height="22" rx="6" fill="#FFFFFF" stroke="#F59E0B"/>
