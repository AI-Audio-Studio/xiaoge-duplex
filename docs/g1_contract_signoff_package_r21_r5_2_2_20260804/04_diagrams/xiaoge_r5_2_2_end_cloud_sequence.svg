  </g><g>
    <path d="M 390 1036 L 1360 1036" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="875" y="1012" text-anchor="middle" font-size="11" font-weight="400" fill="#172033" opacity="1"><tspan x="875" dy="0">M12 confirm/deny/timeout</tspan><tspan x="875" dy="15">取消则无 data.cmd</tspan><tspan x="875" dy="15">FR-CMD-005</tspan></text>
  </g><g>
    <path d="M 1360 1104 L 390 1104" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
