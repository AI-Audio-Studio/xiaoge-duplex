  <text x="60" y="46" text-anchor="start" font-size="24" font-weight="900" fill="#172033" opacity="1"><tspan x="60" dy="0">R5.2.2 端云主时序图（no-legacy + 单命令协议 + 需求ID）</tspan></text>
  <rect x="56" y="72" width="700" height="106" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/><rect x="780" y="72" width="940" height="106" rx="14" fill="#EFF6FF" stroke="#93C5FD"/><text x="86" y="100" text-anchor="start" font-size="15" font-weight="850" fill="#334155" opacity="1"><tspan x="86" dy="0">端侧/机器人侧（本工程外，由协议联调覆盖）</tspan></text><text x="810" y="100" text-anchor="start" font-size="15" font-weight="850" fill="#1D4ED8" opacity="1"><tspan x="810" dy="0">服务器侧小歌（本工程部署目标，支持并发）</tspan></text><g>
    <rect x="58" y="112" width="184" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
