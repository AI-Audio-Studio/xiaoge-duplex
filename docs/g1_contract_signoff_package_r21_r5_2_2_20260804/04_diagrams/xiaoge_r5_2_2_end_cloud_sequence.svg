    <text x="390" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B" opacity="1"><tspan x="390" dy="0">本工程协议对接</tspan></text>
  </g><path d="M 390 190 L 390 1545" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><g>
