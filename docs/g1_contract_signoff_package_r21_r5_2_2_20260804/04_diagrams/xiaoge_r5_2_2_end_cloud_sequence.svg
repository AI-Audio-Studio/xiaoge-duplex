    <text x="150" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B" opacity="1"><tspan x="150" dy="0">端侧主唤醒</tspan></text>
  </g><path d="M 150 190 L 150 1545" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><g>
    <rect x="298" y="112" width="184" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
