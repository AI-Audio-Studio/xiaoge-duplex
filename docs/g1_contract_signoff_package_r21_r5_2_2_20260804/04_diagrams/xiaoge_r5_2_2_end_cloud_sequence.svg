  </g><g>
    <path d="M 390 696 L 1130 696" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="760" y="672" text-anchor="middle" font-size="11" font-weight="400" fill="#172033" opacity="1"><tspan x="760" dy="0">M8 enhanced PCM stream</tspan><tspan x="760" dy="15">前端增强后音频</tspan><tspan x="760" dy="15">FR-AUD-001</tspan></text>
  </g><g>
