    <text x="1204" y="1650" text-anchor="start" font-size="12" font-weight="400" fill="#334155" opacity="1"><tspan x="1204" dy="0">ack timeout 与 result timeout 分离；未 ack 命令断线后不重放；unknown cmd 只审计；</tspan><tspan x="1204" dy="17">JSON 8192/8193 在 G2 验收。</tspan></text>
    <g>
