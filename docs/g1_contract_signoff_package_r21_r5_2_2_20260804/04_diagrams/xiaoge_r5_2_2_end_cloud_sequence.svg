  </g><g>
    <path d="M 390 1172 L 1360 1172" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="875" y="1148" text-anchor="middle" font-size="11" font-weight="400" fill="#172033" opacity="1"><tspan x="875" dy="0">M14 cmd_ack.status</tspan><tspan x="875" dy="15">accepted / rejected / dup</tspan><tspan x="875" dy="15">FR-CMD-008</tspan></text>
  </g><g>
    <path d="M 390 1240 L 630 1240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
