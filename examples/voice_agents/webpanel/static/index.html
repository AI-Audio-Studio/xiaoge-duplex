<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小歌 · 全双工语音交互引擎</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#FFFFFF;color:#1F2024;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:9px;padding:12px 18px;border-bottom:0.5px solid #ECECEF;flex-shrink:0}
.logo{width:26px;height:26px;border-radius:8px;background:#E86A43;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:500}
h1{font-size:15px;font-weight:500;color:#1F2024}
.sub{font-size:12px;color:#9CA3AF}
.statepill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;
  color:#15803D;background:#E7F6EF;padding:4px 12px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:#9CA3AF;transition:background .3s}
.dot.ok{background:#22C55E}.dot.speak{background:#F59E0B;animation:blink 1s infinite}
.dot.off{background:#DC2626}.dot.susp{background:#F59E0B}
.statepill.off{color:#DC2626;background:#FDECEC}
.statepill.susp{color:#B45309;background:#FEF3E2}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
main{flex:1;display:flex;min-height:0}
.left{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.log{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:13px;background:#FBFBFC}
.bubble{position:relative;max-width:min(78%,560px);padding:9px 13px;border-radius:13px;
  font-size:14px;line-height:1.6;word-break:break-word}
.bubble .ts{font-size:11px;margin-top:4px;color:#B6B8BE}
.bubble.assistant{align-self:flex-start;margin-left:36px;background:#FFFFFF;border:0.5px solid #EAEAEE;
  border-bottom-left-radius:4px}
.bubble.user{align-self:flex-end;margin-right:36px;background:#E86A43;color:#fff;border-bottom-right-radius:4px}
.bubble.user .ts{color:#F6D3C6}
.bubble.assistant::before{content:"歌";position:absolute;left:-36px;bottom:0;width:28px;height:28px;
  border-radius:50%;background:#FBEEE8;color:#E86A43;display:flex;align-items:center;justify-content:center;font-size:12px}
.bubble.user::after{content:"我";position:absolute;right:-36px;bottom:0;width:28px;height:28px;
  border-radius:50%;background:#ECEDF0;color:#6B7280;display:flex;align-items:center;justify-content:center;font-size:12px}
.bubble.user.live{background:#FDF1EC;border:1px dashed #F2C3B0;color:#9A3C1E}
.bubble.user.live .ts{color:#C9A08F}
.bubble.protocol{align-self:flex-start;margin-left:36px;background:#F8FAFC;border:0.5px solid #CBD5E1;
  border-bottom-left-radius:4px;color:#334155;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  max-width:min(86%,720px);font-size:12px;line-height:1.45}
.bubble.protocol::before{content:"CMD";position:absolute;left:-36px;bottom:0;width:30px;height:22px;
  border-radius:6px;background:#E0F2FE;color:#0369A1;display:flex;align-items:center;justify-content:center;font-size:9px}
.protocol-title{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;font-weight:600;
  color:#0F172A;margin-bottom:5px}
.protocol-pre{white-space:pre-wrap;word-break:break-word}
.live-dots i{animation:liveBlink 1.2s infinite}
.live-dots i:nth-child(2){animation-delay:.2s}.live-dots i:nth-child(3){animation-delay:.4s}
@keyframes liveBlink{0%,100%{opacity:.25}50%{opacity:1}}
.bubble.appear{animation:bubbleIn .18s ease-out}
@keyframes bubbleIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sys-msg{align-self:center;font-size:11px;color:#B6B8BE;padding:2px 10px}
.dock{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:0.5px solid #ECECEF;background:#fff;flex-shrink:0;position:relative;z-index:25}
.manual{flex:1;min-width:0;height:44px;border:1px solid #D6D7DB;border-radius:10px;padding:0 13px;
  color:#1F2329;font-size:13px;background:#fff;font-family:inherit}
.manual::placeholder{color:#B6B8BE}
.rnd{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;border:none;background:transparent}
#sendBtn{background:#1F2329;color:#fff}
#micBtn{background:#E86A43;color:#fff}
#micBtn.off{background:#FDECEC;color:#DC2626;border:1px solid #F4C9C9}
.ico-on,.ico-off{display:inline-flex;align-items:center;justify-content:center}
#micBtn .ico-off{display:none}#micBtn.off .ico-on{display:none}#micBtn.off .ico-off{display:inline-flex}
#spkBtn{display:none;background:#fff;color:#6B7280;border:1px solid #D6D7DB}
#spkBtn.on{background:#E86A43;color:#fff;border-color:#E86A43}
#spkBtn.standby{background:#9CA3AF;color:#fff;border-color:#9CA3AF}
#spkBtn.err{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.cfg-empty{flex:1;display:flex;align-items:center;justify-content:center;border:1px dashed #E2E3E7;border-radius:10px;color:#B6B8BE;font-size:12px;margin-top:12px}
/* 聆听遮罩:像盖一层纱,完整覆盖会话显示区(底部 dock 通话键浮于其上仍可点)。
   顶部横幅跟随会话区宽度(align-items:stretch 撑满),提示单行不换行。 */
#listenMask{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:stretch;background:rgba(255,247,243,.80);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.listen-card{margin:16px;padding:15px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.93);border:0.5px solid #F2C6B4;border-radius:14px;box-shadow:0 8px 26px rgba(31,32,36,.12)}
.listen-title{font-size:22px;font-weight:700;color:#C2410C;display:flex;align-items:center;gap:11px}
.listen-dot{width:13px;height:13px;border-radius:50%;background:#E86A43;animation:blink 1s infinite;flex-shrink:0}
.listen-hint{font-size:16px;color:#9A6A52;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.right{width:280px;flex-shrink:0;border-left:0.5px solid #ECECEF;background:#FCFCFD;
  padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.cfg-title{font-size:13px;font-weight:500;color:#1F2024}
.cfg-field{display:flex;flex-direction:column;gap:7px}
.cfg-field label{font-size:11px;color:#6B7280}
.api-key-input{width:100%;height:38px;border:1px solid #D6D7DB;border-radius:8px;padding:0 10px;
  color:#1F2329;font-size:12px;background:#fff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.api-key-input:focus{outline:2px solid #F4C7B6;outline-offset:1px;border-color:#E86A43}
.fb-text{width:100%;min-height:84px;resize:vertical;border:1px solid #D6D7DB;border-radius:8px;
  padding:8px 10px;color:#1F2329;font-size:12px;background:#fff;font-family:inherit;line-height:1.5}
.fb-text::placeholder{color:#B6B8BE}
.fb-text:focus{outline:2px solid #F4C7B6;outline-offset:1px;border-color:#E86A43}
.fb-send{height:34px;border:none;border-radius:8px;background:#E86A43;color:#fff;font-size:12px;
  cursor:pointer;font-family:inherit}
.fb-send:hover{background:#D75A33}
.fb-send:disabled{background:#F3D8CC;cursor:default}
.fb-hint{font-size:11px;color:#B6B8BE;min-height:14px;word-break:break-all}
.fb-hint.ok{color:#15803D}.fb-hint.err{color:#DC2626}
/* 完整提示词弹框(2026-09-17):内容长(默认 1783 字)不进右栏,fixed 全屏遮罩承载
   (区别于 #listenMask 的会话区内 absolute)。白卡 720px/92vw、max-h 86vh,
   textarea 占满余高内部滚动;配色贴面板(#E86A43/#D6D7DB/8px 圆角/11-12px)。 */
#promptMask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(31,32,36,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#promptModal{width:720px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;gap:10px;
  background:#fff;border:0.5px solid #D6D7DB;border-radius:14px;box-shadow:0 8px 26px rgba(31,32,36,.12);
  padding:16px 20px}
.pm-head{display:flex;align-items:center;justify-content:space-between}
.pm-title{font-size:14px;font-weight:600;color:#1F2024}
.pm-close{border:none;background:none;font-size:14px;color:#B6B8BE;cursor:pointer;padding:4px 8px;border-radius:6px}
.pm-close:hover{color:#1F2024;background:#F5F5F6}
.pm-status{font-size:11px;color:#B6B8BE}
.pm-status.custom{color:#E86A43}
.pm-text{flex:1;min-height:320px;resize:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.6}
.pm-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pm-foot .fb-hint{flex:1;min-height:14px}
.pm-actions{display:flex;gap:8px;flex-shrink:0}
.pm-ghost{height:34px;padding:0 14px;border:1px solid #D6D7DB;border-radius:8px;background:#fff;
  color:#1F2024;font-size:12px;cursor:pointer;font-family:inherit}
.pm-ghost:hover{border-color:#E86A43;color:#E86A43}
.pm-ghost:disabled{border-color:#D6D7DB;color:#B6B8BE;cursor:default}
.pm-save{padding:0 18px}
/* 会话性格预设弹框(2026-09-22,仅 -97):骨架复用完整提示词弹框(遮罩/白卡/头/脚),
   中部换成滚动卡片流——卡片由 JS 按 GET personas 生成(键固定三档),不在 HTML
   写死三份。 */
#personaMask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(31,32,36,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#personaModal{width:720px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;gap:10px;
  background:#fff;border:0.5px solid #D6D7DB;border-radius:14px;box-shadow:0 8px 26px rgba(31,32,36,.12);
  padding:16px 20px}
#peCards{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.pe-card{border:0.5px solid #ECECEF;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pe-row{display:flex;gap:8px;align-items:center}
.pe-key{font-size:12px;font-weight:600;color:#1F2024;flex-shrink:0}
.pe-label{flex:1;min-width:0;height:34px}
.pe-voice{width:150px;flex-shrink:0}
.pe-traits{min-height:88px;resize:vertical}
.cfg-label{font-size:11px;color:#9CA3AF;margin-bottom:7px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.asr-tab{font-size:12px;padding:6px 11px;border-radius:8px;border:none;background:#F3F4F6;
  color:#6B7280;cursor:pointer;font-family:inherit}
.asr-tab.on{background:#FBEEE8;color:#9A3C1E}
.exp-tag{font-size:10px;color:#9A3C1E;background:#FBEEE8;padding:1px 6px;border-radius:6px}
.param-row{font-size:12px;color:#6B7280;display:flex;justify-content:space-between;margin-bottom:4px}
.track{height:4px;background:#EDEEF1;border-radius:999px;position:relative;margin-bottom:12px}
.track i{position:absolute;left:0;top:0;height:4px;width:62%;background:#E86A43;border-radius:999px}
.track b{position:absolute;left:60%;top:-5px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #E86A43}
.hint{font-size:11px;color:#B6B8BE}
#clearBtn{margin-top:auto;border:none;background:transparent;color:#6B7280;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;padding:11px 0 0;border-top:0.5px solid #ECECEF;font-family:inherit}
footer{text-align:center;padding:9px 16px;border-top:0.5px solid #ECECEF;font-size:11px;color:#B6B8BE;flex-shrink:0}
.sbar{display:none}
</style>
</head>
<body>
<header>
  <span class="logo">歌</span>
  <h1>小歌</h1>
  <span class="sub">· 全双工语音交互引擎</span>
  <span class="statepill" id="statepill"><span class="dot" id="dot"></span><span id="badge">连接中…</span></span>
</header>
<main>
  <div class="left">
    <div class="log" id="log"></div>
    <div class="dock">
      <input class="manual" id="manualInput" maxlength="2000" placeholder="手动输入消息">
      <button class="rnd" id="sendBtn" onclick="sendManualText()" aria-label="发送消息" title="发送消息">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
      </button>
      <button class="rnd" id="micBtn" onclick="toggleMic()" aria-label="录音中,点击关麦">
        <span class="ico-on"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg></span>
        <span class="ico-off"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/><path d="M4 4l16 16"/></svg></span>
      </button>
      <button class="rnd" id="spkBtn" onclick="toggleVoice()" aria-label="连接语音通话" title="连接语音通话">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.32 1.77.59 2.61a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.47-1.16a2 2 0 0 1 2.11-.45c.84.27 1.71.47 2.61.59A2 2 0 0 1 22 16.92z"/></svg>
      </button>
    </div>
    <div id="listenMask" style="display:none">
      <div class="listen-card">
        <div class="listen-title"><span class="listen-dot"></span>聆听中</div>
        <div id="listenHint" class="listen-hint"></div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="cfg-title">配置</div>
    <div class="cfg-field">
      <label for="apiKeyInput">API Key</label>
      <input class="api-key-input" id="apiKeyInput" type="password" autocomplete="off"
        spellcheck="false" placeholder="输入 API Key">
    </div>
    <div class="cfg-title">当前会话设置</div>
    <div class="cfg-field">
      <label for="sessionPersona">性格</label>
      <select class="api-key-input" id="sessionPersona"></select>
    </div>
    <div class="cfg-field">
      <label for="sessionVoice">音色</label>
      <select class="api-key-input" id="sessionVoice"></select>
    </div>
    <div class="cfg-field">
      <label for="agDuplex">全双工</label>
      <select class="api-key-input" id="agDuplex" onchange="saveDuplexToggle()">
        <option value="on">开启 · 正常语音对话（本次会话）</option>
        <option value="off">关闭 · 仅识别出字（本次会话）</option>
      </select>
    </div>
    <button class="fb-send" id="sessionConfigBtn" onclick="applySessionConfig()">保存到当前 API Key</button>
    <div class="fb-hint" id="sessionConfigHint">保存到当前 API Key 对应的项目配置；当前会话也会立即生效。</div>
    <div class="cfg-title">小歌项目配置</div>
    <div class="cfg-field">
      <div class="fb-hint">音色、性格、全双工的默认状态和完整提示词由后台按项目统一管理；上方全双工开关仅对当前会话生效，新会话恢复项目默认。</div>
    </div>
    <div class="cfg-title">问题与反馈</div>
    <div class="cfg-field">
      <textarea class="fb-text" id="fbText" maxlength="2000"
        placeholder="使用中遇到的问题或建议（必填）"></textarea>
      <input class="api-key-input" id="fbContact" type="text" maxlength="100" autocomplete="off"
        placeholder="联系方式（选填）">
      <button class="fb-send" id="fbBtn" onclick="submitFeedback()">提交反馈</button>
      <div class="fb-hint" id="fbHint"></div>
    </div>
    <button id="clearBtn" onclick="clearLog()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4h6v3"/></svg>清空记录</button>
  </div>
</main>
<footer>© 2026 小歌 Duplex · ATC- AI音频研发部 · 内部测试面板</footer>
<!-- 隐藏状态镜像 + 配置控件(暂从界面移除,保留以维持 JS 现状,后续可放回面板) -->
<div class="sbar">
  <span id="sbWs"></span><span id="sbMic"></span><span id="sbAsr"></span><span id="sbTts"></span><span id="sbVoice"></span><span id="sbMsgs"></span>
  <!--BACKEND_TABS-->
</div>
<!-- 只读项目配置说明；后台管理页负责编辑，不在此处提供写入口。 -->
<script>
var ws=null, protoSession=null, muted=false, msgN=0, curAsr='funasr', curTts='cosyvoice', serverBusy=false;
var connPromise=null, activeAttempt=null, attemptSeq=0, connectionState='idle';
var VOICE_WELCOME='连接成功，欢迎使用小歌，请开始说话。';
var wsProto = location.protocol==='https:' ? 'wss:' : 'ws:';
var voiceActive=false, AUDIO_SR=16000;
var standbyOn=false;   // 待命态(收到 standby on 帧):停发音频,点通话按钮唤醒
var liveBubble=null, activeUserBubbles=Object.create(null), finalizedUserTurns=Object.create(null);
var finalizedUserTurnOrder=[], FINALIZED_USER_TURN_LIMIT=384, legacyLiveId=null;
var userTurnAliases=Object.create(null), userTurnAliasOrder=[], USER_TURN_ALIAS_LIMIT=384;
var localUserEchoes=[];                     // 手动输入本地回显，等待服务端 data.stt final 去重
var LOCAL_ECHO_TTL_MS=12000;
var sessionDuplexOn=true;                   // 全双工开关仅当前会话有效;新 ctrl.hello 恢复项目默认(attach 推 ctrl.duplex_state 对齐)
var sessionPersona='';                      // 会话性格 key;三档即全部选项(无空串项),新会话默认第一档;ack ctrl.persona_state 对齐
var RUOYI_API_KEY_STORE='xiaoge.webpanel.ruoyi_api_key.v1';
var DEMO_QUERY_TOKEN_ENABLED=true;

function getRuoyiApiKey(){
  var input=id('apiKeyInput');
  return input ? input.value.trim() : '';
}
function loadRuoyiApiKey(){
  try{ return localStorage.getItem(RUOYI_API_KEY_STORE) || ''; }
  catch(err){ return ''; }
}
function saveRuoyiApiKey(){
  var value=getRuoyiApiKey();
  try{
    if(value) localStorage.setItem(RUOYI_API_KEY_STORE, value);
    else localStorage.removeItem(RUOYI_API_KEY_STORE);
  }catch(err){}
  return value;
}

async function createProtocolSession(){
  var headers={'Content-Type':'application/json'};
  var apiKey=saveRuoyiApiKey();
  if(!apiKey) throw new Error('请输入 API Key');
  headers['X-API-Key']=apiKey;
  var r=await fetch('/create_session',{method:'POST',
    headers:headers,
    body:JSON.stringify({
      device_id:'web-panel-x3',
      credential:{key_id:'web-panel',signature:'debug-session'},
      caps:['audio','text','cmd','state'],
      prefs:{'welcome.enabled':true},
      connect_reason:'call_button',
      audio_format:{sample_rate:AUDIO_SR,channels:1,sample_format:'int16le'},
      client_version:'web-panel-r5.2.2'
    })});
  if(!r.ok) throw new Error('create_session '+r.status);
  return await r.json();
}

function newConnectionAttempt(){
  if(activeAttempt) disposeAttempt(activeAttempt, true);
  var attempt={id:++attemptSeq, disposed:false, intentionalClose:false, session:null, ws:null,
    timer:null, pingTimer:null, stream:null, captureCtx:null, playCtx:null, source:null, worklet:null,
    ready:false, scheduled:[], nextPlayTime:0};
  activeAttempt=attempt;
  connectionState='connecting';
  return attempt;
}
function isCurrentAttempt(attempt){ return activeAttempt===attempt && !attempt.disposed; }
function syncConnectionRefs(attempt){
  if(!isCurrentAttempt(attempt)) return;
  ws=attempt.ws; protoSession=attempt.session;
}
function closeAttemptAudio(attempt){
  attempt.scheduled.forEach(function(source){ try{source.stop(0);}catch(err){} });
  attempt.scheduled=[]; attempt.nextPlayTime=0;
  if(attempt.worklet){
    attempt.worklet.port.onmessage=null;
    try{attempt.worklet.disconnect();}catch(err){}
    attempt.worklet=null;
  }
  if(attempt.source){ try{attempt.source.disconnect();}catch(err){} attempt.source=null; }
  if(attempt.stream){ attempt.stream.getTracks().forEach(function(track){track.stop();}); attempt.stream=null; }
  if(attempt.captureCtx){ try{attempt.captureCtx.close();}catch(err){} attempt.captureCtx=null; }
  if(attempt.playCtx){ try{attempt.playCtx.close();}catch(err){} attempt.playCtx=null; }
}
function disposeAttempt(attempt, intentional){
  if(!attempt || attempt.disposed) return;
  attempt.intentionalClose=!!intentional;
  attempt.disposed=true;
  if(attempt.timer){ clearTimeout(attempt.timer); attempt.timer=null; }
  if(attempt.pingTimer){ clearInterval(attempt.pingTimer); attempt.pingTimer=null; }
  closeAttemptAudio(attempt);
  if(attempt.ws){ try{attempt.ws.close();}catch(err){} }
  if(activeAttempt===attempt){
    activeAttempt=null; ws=null; protoSession=null; connPromise=null; voiceActive=false;
  }
}
function showIdleState(){
  standbyOn=false;
  connectionState='idle'; stConn=false; updateStatus(); setVoiceActive(false);
}
function failAttempt(attempt, message){
  if(!isCurrentAttempt(attempt)) return;
  disposeAttempt(attempt, false);
  connectionState='failed'; stConn=false; updateStatus();
  setVoiceError('连接失败，点击重试');
  sysMsg(message || '连接失败，请点击通话按钮重试');
}

async function conn(attempt){
  if(serverBusy) throw new Error('server busy');
  if(!attempt){
    if(activeAttempt && !activeAttempt.disposed && activeAttempt.ws &&
       activeAttempt.ws.readyState===WebSocket.OPEN && activeAttempt.ready) return activeAttempt;
    attempt=newConnectionAttempt();
  }
  if(!isCurrentAttempt(attempt)) throw new Error('连接尝试已失效');
  if(connPromise) return connPromise;
  connPromise=(async function(){
    attempt.session=await createProtocolSession();
    if(!isCurrentAttempt(attempt)) throw new Error('连接尝试已失效');
    var session=attempt.session;
    var sessionPath='/debug/ws/session?access_token='+encodeURIComponent(session.access_token);
    var debugWsUrl=wsProto+'//'+location.host+sessionPath;
    var socket=new WebSocket(debugWsUrl);
    attempt.ws=socket; socket.binaryType='arraybuffer'; syncConnectionRefs(attempt);
    await new Promise(function(resolve, reject){
      var settled=false;
      function rejectOnce(err){ if(settled) return; settled=true; reject(err); }
      attempt.timer=setTimeout(function(){
        if(!isCurrentAttempt(attempt) || settled) return;
        rejectOnce(new Error('R5.2.2 WS hello timeout'));
      }, 10000);
      socket.onopen=function(){
        if(!isCurrentAttempt(attempt)) return;
        sessionDuplexOn=true;
        sessionPersona='';
        var dup=id('agDuplex');
        if(dup) dup.value='on';
        var per=id('agPersona');
        if(per && per.options.length) per.value=per.options[0].value;   // 新会话=默认档(第一项,配置加载前为空则留给 fillAgentConfig)
        socket.send(JSON.stringify({
          type:'ctrl.hello', trace_id:session.trace_id, session_id:session.session_id,
          proto:2, role:'panel', device_id:'web-panel-x3',
          caps:session.granted_caps || ['audio','text','cmd','state'],
          prefs:{'welcome.enabled':true}
        }));
        // 保活(2026-10-12):每 25s 发 ctrl.ping,服务端回 ctrl.pong(handle 里静默
        // 吞掉)。25s < 常见 LB/网关 60s 空闲断连,长连接不被中间层掐。
        attempt.pingTimer=setInterval(function(){
          if(!isCurrentAttempt(attempt) || socket.readyState!==WebSocket.OPEN) return;
          try{ socket.send(JSON.stringify({type:'ctrl.ping', ts_ms:Date.now()})); }catch(err){}
        }, 25000);
      };
      socket.onmessage=function(e){
        if(!isCurrentAttempt(attempt)) return;
        if(e.data instanceof ArrayBuffer){ playPcm(e.data, attempt); return; }
        var message=JSON.parse(e.data);
        if(message.type==='ctrl.duplex_state'){
          sessionDuplexOn=!!message.enabled;
          var dup=id('agDuplex');
          if(dup) dup.value=sessionDuplexOn?'on':'off';
          return;
        }
        if(message.type==='ctrl.persona_state'){
          sessionPersona=message.persona||'';
          var per=id('agPersona');
          if(per) per.value=sessionPersona;
          return;
        }
        if(message.type==='ctrl.session_config_state'){
          var sp=id('sessionPersona'), sv=id('sessionVoice');
          if(sp && message.persona) sp.value=message.persona;
          if(sv && message.voice) sv.value=message.voice;
          var sh=id('sessionConfigHint');
          if(sh){ sh.className='fb-hint ok'; sh.textContent='已应用到当前 API Key 配置，本次会话立即生效'; }
          return;
        }
        if(message.type==='ctrl.ready' && !settled){
          settled=true; attempt.ready=true;
          if(attempt.timer){clearTimeout(attempt.timer);attempt.timer=null;}
          stConn=true; updateStatus(); resolve();
        }
        handle(message);
      };
      socket.onerror=function(){
        if(!isCurrentAttempt(attempt)) return;
        if(!attempt.ready) rejectOnce(new Error('R5.2.2 WS connect failed'));
      };
      socket.onclose=function(){
        if(!isCurrentAttempt(attempt) || attempt.intentionalClose) return;
        if(!attempt.ready) rejectOnce(new Error('R5.2.2 WS closed before ready'));
        else failAttempt(attempt, '连接已断开，请点击通话按钮重试');
      };
    });
    if(!isCurrentAttempt(attempt)) throw new Error('连接尝试已失效');
    return attempt;
  })();
  try{ return await connPromise; }
  catch(err){ if(isCurrentAttempt(attempt)) failAttempt(attempt, '连接失败：'+err.message); throw err; }
  finally{ if(isCurrentAttempt(attempt) || activeAttempt===null) connPromise=null; }
}

function handle(m){
  if(m.type==='busy'){
    serverBusy=true;
    sysMsg(m.message || '服务器繁忙，请稍后再试！');
    try{ if(activeAttempt) failAttempt(activeAttempt, m.message || '服务器繁忙，请稍后再试！'); }
    catch(err){}
    return;
  }
  if(m.type==='clear'){ clearPlayback(); return; }
  if(m.type==='ctrl.clear'){ clearPlayback(); return; }
  if(m.type==='ctrl.ready'){
    AUDIO_SR=m.sample_rate || AUDIO_SR;
    id('spkBtn').style.display='flex';
    sysMsg('ctrl.ready：已连接 R5.2.2 合并 WS');
    return;
  }
  if(m.type==='ctrl.pong'){ return; }  // 保活应答(2026-10-12):仅维持长连接,无 UI
  if(m.type==='ctrl.state'){
    // V2 三态(2026-10-12):sleeping 休眠(停发音频)/ listening 聆听 / dialogue 或
    // 旧值 = 对话。V1 兼容:旧服务端恒发 dialogue → else 分支,行为与旧版一致。
    if(m.interaction_mode==='sleeping'){
      if(!standbyOn){
        standbyOn=true;
        setAgent('standby');
        setVoiceActive(voiceActive);
        sysMsg('小歌休眠中：已停止发送音频，点通话按钮唤醒');
      }
    } else if(m.interaction_mode==='listening'){
      setAgent('listening');
    } else {
      if(standbyOn){
        standbyOn=false;
        sysMsg('小歌已唤醒');
      }
      setAgent('idle');
    }
    return;
  }
  if(m.type==='data.stt'){
    applyUserTranscript(m.utterance_id, m.text, !!m.final, m.ts_ms||Date.now(), m.session_id);
    return;
  }
  if(m.type==='data.reply'){
    upsertAssistantMsg(m.utterance_id, m.text, (m.ts_ms||Date.now())/1000, false);
    return;
  }
  if(m.type==='data.cmd'){
    addProtocolFrame(m, false);
    simulateEndpointCommand(m);
    return;
  }
  if(m.type==='listening'){ setListening(m.on, m.hint); }
  if(m.type==='standby'){
    standbyOn=!!m.on;
    setAgent(m.on?'standby':'idle');
    setVoiceActive(voiceActive);
    sysMsg(m.on?'小歌已待命：已停止发送音频，点通话按钮唤醒':'小歌已唤醒');
  }
  if(m.type==='user_speaking' && m.state==='start'){
    legacyLiveId=m.utterance_id || legacyLiveId || ('legacy-'+Date.now());
    startLive(legacyLiveId);
  }
  if(m.type==='user_partial') applyUserTranscript(m.utterance_id||legacyLiveId, m.text, false, Date.now(), 'legacy');
  if(m.type==='g3_protocol'){ addProtocol(m); }
  if(m.type==='message'){
    if(m.role==='user') applyUserTranscript(m.utterance_id||legacyLiveId, m.text, true, (m.ts||Date.now()/1000)*1000, 'legacy');
    else if(m.role==='assistant') upsertAssistantMsg(m.utterance_id, m.text, m.ts, false);
    else addMsg(m.role, m.text, m.ts);
  }
  if(m.type==='state'){
    if(m.muted       !== undefined) setMic(m.muted);
    if(m.stt_backend !== undefined) setAsr(m.stt_backend);
    if(m.tts_backend !== undefined) setTts(m.tts_backend);
    if(m.agent_state !== undefined) setAgent(m.agent_state);
    if(m.audio_mode !== undefined && m.audio_mode && !voiceActive){
      id('spkBtn').style.display='flex';
      id('spkBtn').title='连接语音通话';
      id('sbVoice').textContent='Voice: disconnected';
      sysMsg('点击通话按钮连接浏览器麦克风和播放声音');
    }
    if(m.audio_mode !== undefined && !m.audio_mode){
      id('spkBtn').style.display='none';
    }
  }
}

// ── 用户实时转写:按会话+utterance_id 幂等更新/定稿────────────────────
function transcriptKey(utteranceId, sessionId){
  var sid=sessionId || (protoSession && protoSession.session_id) || 'legacy';
  var raw=sid+'|'+(utteranceId || legacyLiveId || 'legacy-active');
  return userTurnAliases[raw] || raw;
}
function aliasUserTurn(utteranceId, sessionId, canonicalKey){
  if(!utteranceId || !canonicalKey) return;
  var sid=sessionId || (protoSession && protoSession.session_id) || 'legacy';
  var aliasKey=sid+'|'+utteranceId;
  if(!userTurnAliases[aliasKey]) userTurnAliasOrder.push(aliasKey);
  userTurnAliases[aliasKey]=canonicalKey;
  while(userTurnAliasOrder.length>USER_TURN_ALIAS_LIMIT){
    delete userTurnAliases[userTurnAliasOrder.shift()];
  }
}
function rememberFinalizedTurn(key){
  if(finalizedUserTurns[key]) return;
  finalizedUserTurns[key]=true; finalizedUserTurnOrder.push(key);
  while(finalizedUserTurnOrder.length>FINALIZED_USER_TURN_LIMIT){
    delete finalizedUserTurns[finalizedUserTurnOrder.shift()];
  }
}
function createLiveBubble(key){
  var bubble=document.createElement('div');
  bubble.className='bubble user live appear';
  bubble.innerHTML='<div class="live-txt"><span class="live-dots">聆听中<i>.</i><i>.</i><i>.</i></span></div>';
  bubble.dataset.turnKey=key;
  log().appendChild(bubble); log().scrollTop=log().scrollHeight;
  activeUserBubbles[key]=bubble; liveBubble=bubble;
  return bubble;
}
function startLive(utteranceId, sessionId){
  var key=transcriptKey(utteranceId, sessionId);
  if(finalizedUserTurns[key]) return null;
  return activeUserBubbles[key] || createLiveBubble(key);
}
function updateLive(text, utteranceId, sessionId){
  var key=transcriptKey(utteranceId, sessionId);
  if(finalizedUserTurns[key]) return;
  var bubble=activeUserBubbles[key] || createLiveBubble(key);
  if(text) bubble.querySelector('.live-txt').textContent=text;
  liveBubble=bubble; log().scrollTop=log().scrollHeight;
}
function finalizeLive(text, ts, utteranceId, sessionId){
  var key=transcriptKey(utteranceId, sessionId);
  if(finalizedUserTurns[key]) return;
  var bubble=activeUserBubbles[key];
  if(!bubble){ addMsg('user', text, ts); rememberFinalizedTurn(key); return; }
  bubble.className='bubble user';
  var shown=ts ? new Date(ts*1000).toLocaleTimeString('zh-CN') : '';
  bubble.innerHTML='<div>'+esc(text||'')+'</div><div class="ts">'+shown+'</div>';
  delete activeUserBubbles[key];
  if(liveBubble===bubble) liveBubble=null;
  rememberFinalizedTurn(key);
  id('sbMsgs').textContent=(++msgN)+' 条消息';
  log().scrollTop=log().scrollHeight;
}
function applyUserTranscript(utteranceId, text, final, tsMs, sessionId){
  var idValue=utteranceId || legacyLiveId || ('legacy-'+String(tsMs||Date.now()));
  var currentKey=transcriptKey(idValue, sessionId);
  if(legacyLiveId && utteranceId && utteranceId!==legacyLiveId){
    var legacyKey=transcriptKey(legacyLiveId, sessionId);
    if(activeUserBubbles[legacyKey] || finalizedUserTurns[legacyKey]){
      aliasUserTurn(utteranceId, sessionId, legacyKey);
      currentKey=legacyKey;
    }
  }
  if(final && consumeLocalUserEcho(text, tsMs||Date.now())){
    var echoBubble=activeUserBubbles[currentKey];
    if(echoBubble){echoBubble.remove();delete activeUserBubbles[currentKey];if(liveBubble===echoBubble)liveBubble=null;}
    rememberFinalizedTurn(currentKey); legacyLiveId=null; return;
  }
  if(final){ finalizeLive(text, (tsMs||Date.now())/1000, idValue, sessionId); legacyLiveId=null; }
  else updateLive(text, idValue, sessionId);
}
function isActiveProtocolConnection(socket, session){
  return ws===socket && protoSession===session && socket.readyState===WebSocket.OPEN;
}

function commandCorrelation(command){
  return {
    trace_id:command.trace_id,
    session_id:command.session_id,
    utterance_id:command.utterance_id,
    cmd_id:command.cmd_id
  };
}

function simulateEndpointCommand(command){
  var socket=ws, session=protoSession;
  if(!socket || !session || !isActiveProtocolConnection(socket, session)) return;
  var correlation=commandCorrelation(command);
  var receivedAt=Date.now();
  try{
    socket.send(JSON.stringify(Object.assign({
      type:'data.cmd_ack',
      status:'accepted',
      code:'webpanel_simulator_received',
      received_at_ms:receivedAt
    }, correlation)));
  }catch(err){
    sysMsg('模拟端侧 ACK 发送失败：'+err.message);
    return;
  }
  setTimeout(function(){
    if(!isActiveProtocolConnection(socket, session)) return;
    var gesture=command.params && command.params.gesture;
    var failed=command.action==='gesture.perform' && (gesture==='laugh' || gesture==='cry');
    var resultPayload={};
    // Web 端端侧模拟器: 电量查询默认返回 67%, 触发服务端 check_battery 结果口播链路。
    if(command.action==='check_battery'){
      resultPayload.result={
        type:'cap',
        value:67,
        gauge_id:(command.params && command.params.gauge_id) || 1
      };
    }
    var finishedAt=Date.now();
    try{
      socket.send(JSON.stringify(Object.assign({
        type:'data.cmd_result',
        status:failed ? 'failed' : 'succeeded',
        code:failed ? 'webpanel_simulator_failed' : 'webpanel_simulator_succeeded',
        started_at_ms:receivedAt,
        finished_at_ms:finishedAt,
        duration_ms:Math.max(0, finishedAt-receivedAt),
        retryable:false
      }, resultPayload, correlation)));
    }catch(err){
      sysMsg('模拟端侧结果发送失败：'+err.message);
    }
  }, 1000);
}

async function sendManualText(){
  var inp=id('manualInput');
  if(!inp) return;
  var text=inp.value.trim();
  if(!text) return;
  try{
    if(!ws || ws.readyState!==WebSocket.OPEN) await conn();
    if(!ws || ws.readyState!==WebSocket.OPEN) throw new Error('R5.2.2 WS 未连接');
    ws.send(JSON.stringify({
      type:'data.text',
      trace_id:protoSession.trace_id,
      session_id:protoSession.session_id,
      utterance_id:'utt-manual-'+Date.now(),
      text:text,
      final:true,
      ts_ms:Date.now()
    }));
    addLocalUserEcho(text, Date.now());
    inp.value='';
  }catch(err){
    sysMsg('发送失败：'+err.message);
  }
}

// Browser voice bridge: microphone PCM and TTS PCM share R5.2.2 /ws/session.
async function toggleVoice(){
  if(connectionState==='active' && activeAttempt){
    if(standbyOn){ resumeFromStandby(); return; }
    stopVoice(); return;
  }
  await startVoice();
}

// 待命恢复(退出机制 2026-09-15):WS 一直连着(服务端待命≠断开),这里本地
// 恢复发音频。唤醒是服务端语义:说话/发文字即真实用户输入(ctrl.frontend_state
// 唤醒帧已退役 2026-10-13,服务端不再处理)。
function resumeFromStandby(){
  standbyOn=false; setAgent('idle'); setVoiceActive(voiceActive);
  sysMsg('已唤醒小歌，可以继续说话');
}

async function startVoice(){
  var attempt=newConnectionAttempt();
  serverBusy=false; setVoiceConnecting();
  try{
    await conn(attempt);
    if(!isCurrentAttempt(attempt)) return;
    sysMsg('正在连接浏览器麦克风...');
    attempt.playCtx=new AudioContext({sampleRate:AUDIO_SR});
    if(attempt.playCtx.state==='suspended') await attempt.playCtx.resume();
    if(!isCurrentAttempt(attempt)) return;
    var stream=await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true
    }});
    if(!isCurrentAttempt(attempt)){ stream.getTracks().forEach(function(track){track.stop();}); return; }
    attempt.stream=stream;
    attempt.captureCtx=new AudioContext({sampleRate:AUDIO_SR});
    if(attempt.captureCtx.state==='suspended') await attempt.captureCtx.resume();
    if(!isCurrentAttempt(attempt)) return;
    attempt.source=attempt.captureCtx.createMediaStreamSource(stream);
    var workletSrc=`class P extends AudioWorkletProcessor{process(i){var c=i[0]&&i[0][0];if(c){var b=new Int16Array(c.length);for(var j=0;j<c.length;j++)b[j]=Math.max(-32768,Math.min(32767,c[j]*32767));this.port.postMessage(b.buffer,[b.buffer])}return true}}registerProcessor('p',P);`;
    var blobUrl=URL.createObjectURL(new Blob([workletSrc],{type:'application/javascript'}));
    try{ await attempt.captureCtx.audioWorklet.addModule(blobUrl); }
    finally{ URL.revokeObjectURL(blobUrl); }
    if(!isCurrentAttempt(attempt)) return;
    attempt.worklet=new AudioWorkletNode(attempt.captureCtx,'p');
    var socket=attempt.ws;
    attempt.worklet.port.onmessage=function(e){
      // 待命(standbyOn)即停发音频——服务端已通知端侧停止,唤醒后自动恢复。
      if(isCurrentAttempt(attempt) && socket.readyState===WebSocket.OPEN && !muted && !standbyOn) socket.send(e.data);
    };
    attempt.source.connect(attempt.worklet);
    connectionState='active'; setVoiceActive(true); sysMsg(VOICE_WELCOME);
  }catch(err){
    if(isCurrentAttempt(attempt)) failAttempt(attempt, '语音连接失败：'+err.message);
  }
}

function playPcm(buf, attempt){
  attempt=attempt || activeAttempt;
  if(!isCurrentAttempt(attempt) || !attempt.playCtx) return;
  var ctx=attempt.playCtx;
  var i16=new Int16Array(buf), f32=new Float32Array(i16.length);
  for(var i=0;i<i16.length;i++) f32[i]=i16[i]/32767;
  var ab=ctx.createBuffer(1,f32.length,AUDIO_SR);
  ab.copyToChannel(f32,0);
  var source=ctx.createBufferSource(); source.buffer=ab; source.connect(ctx.destination);
  var now=ctx.currentTime;
  if(attempt.nextPlayTime<now) attempt.nextPlayTime=now+0.05;
  source.start(attempt.nextPlayTime); attempt.nextPlayTime+=ab.duration;
  attempt.scheduled.push(source);
  source.onended=function(){
    var index=attempt.scheduled.indexOf(source); if(index>=0) attempt.scheduled.splice(index,1);
  };
}
function clearPlayback(){
  if(!activeAttempt) return;
  activeAttempt.scheduled.forEach(function(source){try{source.stop(0);}catch(err){}});
  activeAttempt.scheduled=[]; activeAttempt.nextPlayTime=0;
}
function stopVoice(){
  var attempt=activeAttempt;
  standbyOn=false;
  if(attempt) disposeAttempt(attempt, true);
  showIdleState();
}
function setVoiceConnecting(){
  voiceActive=false; standbyOn=false;
  var button=id('spkBtn');
  if(button){button.className='rnd';button.title='正在连接…';button.setAttribute('aria-label','正在连接语音通话');}

}
function setVoiceActive(active){
  voiceActive=active;
  var button=id('spkBtn');

  button.className='rnd'+(standbyOn?' standby':(active?' on':''));
  button.setAttribute('aria-label', standbyOn?'唤醒小歌':(active?'断开语音通话':'连接语音通话'));
  button.title=standbyOn?'唤醒小歌':(active?'断开语音通话':'连接语音通话');
  id('sbVoice').textContent='Voice: '+(active?'connected':'disconnected');
}
function setVoiceError(text){
  voiceActive=false;
  var button=id('spkBtn');
  if(button){button.className='rnd err';button.title=text;button.setAttribute('aria-label',text);}
  id('sbVoice').textContent='Voice: '+text;
}

function addLocalUserEcho(text, tsMs){
  addMsg('user', text, tsMs/1000);
  localUserEchoes.push({text:text, tsMs:tsMs});
  pruneLocalUserEchoes(Date.now());
}
function consumeLocalUserEcho(text, tsMs){
  pruneLocalUserEchoes(tsMs || Date.now());
  var normalized=(text||'').trim();
  for(var i=0;i<localUserEchoes.length;i++){
    if(localUserEchoes[i].text===normalized){
      localUserEchoes.splice(i,1);
      return true;
    }
  }
  return false;
}
function pruneLocalUserEchoes(nowMs){
  localUserEchoes=localUserEchoes.filter(function(e){ return nowMs-e.tsMs<LOCAL_ECHO_TTL_MS; });
}

// 状态优先级:服务断开 > 挂起中(关麦)> 正常 agent 状态
var stConn=false, stMuted=false, stAgent='';
function updateStatus(){
  var pill=id('statepill'), dot=id('dot'), bg=id('badge');
  if(!stConn){ pill.className='statepill off'; dot.className='dot off'; bg.textContent='服务断开'; return; }
  if(stAgent==='standby'){ pill.className='statepill susp'; dot.className='dot susp'; bg.textContent='已待命'; return; }
  if(stMuted){ pill.className='statepill susp'; dot.className='dot susp'; bg.textContent='挂起中'; return; }
  var labels={idle:'空闲', listening:'监听中', thinking:'思考中', speaking:'播报中', standby:'已待命'};
  pill.className='statepill';
  dot.className='dot '+(stAgent==='speaking'?'speak':'ok');
  bg.textContent = labels[stAgent] || stAgent || '已连接';
}
function setAgent(s){ stAgent=s; updateStatus(); }

function setMic(m){
  muted=!!m;

  id('sbMic').textContent='麦克风: '+(muted?'关闭':'开启');
  updateStatus();   // 关麦→挂起中,开麦→正常
}

var assistantBubbles={};
var assistantDone={};
function renderBubbleHtml(text, ts){
  var t=ts ? new Date(ts*1000).toLocaleTimeString('zh-CN') : '';
  return '<div>'+esc(text)+'</div><div class="ts">'+t+'</div>';
}
function addMsg(role, text, ts){
  if(!text) return;
  var d=document.createElement('div');
  d.className='bubble '+role+' appear';
  d.innerHTML=renderBubbleHtml(text, ts);
  // Bug1 修复:助手回复(LLM 生成完才广播)若晚于用户已开口的 live 气泡到达,
  // 插到 live 气泡之上,保持时序 [用户上一轮][小歌回复][用户进行中],不被排到下面。
  if(role==='assistant' && liveBubble){ log().insertBefore(d, liveBubble); }
  else { log().appendChild(d); }
  log().scrollTop=log().scrollHeight;
  id('sbMsgs').textContent=(++msgN)+' 条消息';
}

function upsertAssistantMsg(replyId, text, ts, partial){
  if(!text) return;
  if(!replyId){ addMsg('assistant', text, ts); return; }
  if(assistantDone[replyId]) return;
  var d=assistantBubbles[replyId];
  if(!d){
    d=document.createElement('div');
    d.className='bubble assistant appear';
    assistantBubbles[replyId]=d;
    if(liveBubble){ log().insertBefore(d, liveBubble); }
    else { log().appendChild(d); }
    id('sbMsgs').textContent=(++msgN)+' 条消息';
  }
  d.innerHTML=renderBubbleHtml(text, ts);
  if(!partial){
    delete assistantBubbles[replyId];
    assistantDone[replyId]=Date.now();
    setTimeout(function(){ delete assistantDone[replyId]; }, 60000);
  }
  log().scrollTop=log().scrollHeight;
}

function addProtocol(m){
  var frames=m.frames||[];
  if(!frames.length) return;
  addProtocolFrame(frames[0], !!m.dry_run);
}

function addProtocolFrame(frame, dryRun){
  var d=document.createElement('div');
  d.className='bubble protocol appear';
  var title=frame.type+(frame.action ? ' · '+frame.action : '')+(dryRun ? ' · dry-run' : '');
  var body={
    type: frame.type,
    action: frame.action,
    capability_id: frame.capability_id,
    params: frame.params,
    risk_level: frame.risk_level,
    cmd_id: frame.cmd_id
  };
  d.innerHTML='<div class="protocol-title">'+esc(title)+'</div><div class="protocol-pre">'+esc(JSON.stringify(body,null,2))+'</div>';
  if(liveBubble){ log().insertBefore(d, liveBubble); }
  else { log().appendChild(d); }
  log().scrollTop=log().scrollHeight;
  id('sbMsgs').textContent=(++msgN)+' 条消息';
}

function sysMsg(t){
  var d=document.createElement('div');
  d.className='sys-msg'; d.textContent=t;
  log().appendChild(d);
  log().scrollTop=log().scrollHeight;
}

function clearLog(){
  id('log').innerHTML=''; msgN=0; id('sbMsgs').textContent='0 条消息';
  activeUserBubbles=Object.create(null); finalizedUserTurns=Object.create(null);
  finalizedUserTurnOrder=[]; userTurnAliases=Object.create(null); userTurnAliasOrder=[];
  liveBubble=null; legacyLiveId=null;
}

async function toggleMic(){
  // 麦克风按钮同时承担“开始语音”和“静音/开麦”：语音按钮在当前布局中隐藏，
  // 因而未连接时点击麦克风必须先建立浏览器采集与 WS 会话。
  if(connectionState!=='active' || !activeAttempt){
    await startVoice();
    return;
  }
  var next=!muted;
  setMic(next);
  try{
    var r=await fetch('/api/mic',{method:'POST'});
    if(r.ok){
      var d=await r.json();
      if(typeof d.muted==='boolean') setMic(d.muted);
    }
  }catch(err){
    // PCM 发送门已经由本地 muted 控制，网关同步失败不影响当前页面操作。
  }
}

// 问题与反馈:走网关 /api/feedback(apikey 准入 + 无亲和反代),后台逐条落盘 data/feedback/。
async function submitFeedback(){
  var btn=id('fbBtn'), hint=id('fbHint'), text=id('fbText').value.trim();
  if(!hint) return;
  if(!text){ hint.className='fb-hint err'; hint.textContent='请先填写反馈内容'; return; }
  var headers={'Content-Type':'application/json'};
  var apiKey=getRuoyiApiKey();
  if(apiKey) headers['X-API-Key']=apiKey;
  if(btn) btn.disabled=true;
  hint.className='fb-hint'; hint.textContent='提交中…';
  try{
    var r=await fetch('/api/feedback',{method:'POST', headers:headers,
      body:JSON.stringify({text:text, contact:id('fbContact').value.trim()})});
    var d={};
    try{ d=await r.json(); }catch(err){}
    if(r.ok && d.ok){
      hint.className='fb-hint ok'; hint.textContent='已收到，感谢反馈！';
      id('fbText').value=''; id('fbContact').value='';
    }else if(r.status===401){
      hint.className='fb-hint err'; hint.textContent='提交失败：请先在上方输入正确的 API Key';
    }else{
      hint.className='fb-hint err'; hint.textContent='提交失败：'+(d.error||('HTTP '+r.status));
    }
  }catch(err){
    hint.className='fb-hint err'; hint.textContent='提交失败：'+err.message;
  }finally{
    if(btn) btn.disabled=false;
  }
}

async function applySessionConfig(){
  var hint=id('sessionConfigHint'), btn=id('sessionConfigBtn');
  var persona=id('sessionPersona').value;
  var voice=id('sessionVoice').value;
  if(!persona || !voice){
    if(hint){ hint.className='fb-hint err'; hint.textContent='性格和音色选项尚未加载'; }
    return;
  }
  if(btn) btn.disabled=true;
  try{
    // Only the editable current-key fields are sent. Target/worker/session fields
    // are intentionally not part of this contract.
    await saveApiKeyOverride({persona:persona, voice:voice, reset:false});
    if(ws && ws.readyState===WebSocket.OPEN){
      ws.send(JSON.stringify({type:'ctrl.session_config', persona:persona, voice:voice}));
    }
    if(hint){ hint.className='fb-hint ok'; hint.textContent='已保存到当前 API Key 配置，本次会话已生效'; }
  }catch(err){
    if(hint){ hint.className='fb-hint err'; hint.textContent='保存失败：'+err.message; }
  }finally{
    if(btn) btn.disabled=false;
  }
}

function fillSessionConfig(cfg){
  var p=id('sessionPersona'), v=id('sessionVoice');
  if(!p || !v) return;
  p.innerHTML=''; v.innerHTML='';
  (cfg.personas||[]).forEach(function(item){
    var po=document.createElement('option'); po.value=item.key; po.textContent=item.label; p.appendChild(po);
  });
  (cfg.voices||[]).forEach(function(item){
    var vo=document.createElement('option'); vo.value=item.key; vo.textContent=item.label; v.appendChild(vo);
  });
  if(p.options.length) p.value=cfg.persona_key||p.options[0].value;
  if(v.options.length) v.value=cfg.voice_key||cfg.tts_voice||v.options[0].value;
}

// 持久化由 RuoYi 后台完成；当前会话设置仍通过受信任 session WS 帧临时覆盖。
// 此调用只写当前 API Key 对应的后台覆盖，不会写 agent_config.json，也不接受目标字段。
async function saveApiKeyOverride(payload){
  var headers={'Content-Type':'application/json'};
  var apiKey=saveRuoyiApiKey();
  if(!apiKey) throw new Error('请输入 API Key');
  headers['X-API-Key']=apiKey;
  var r=await fetch('/api/api-key-override',{method:'PUT',headers:headers,
    body:JSON.stringify(payload||{})});
  var data={};
  try{ data=await r.json(); }catch(err){}
  if(!r.ok) throw new Error(data.error||data.code||('HTTP '+r.status));
  return data;
}

async function loadAgentConfig(){
  var hint=id('sessionConfigHint');
  if(hint) hint.textContent='输入 API Key 后可保存该 API Key 的性格和音色设置；未设置覆盖时跟随项目默认';
  try{
    var r=await fetch('/api/agentconfig',{headers:{'X-API-Key':getRuoyiApiKey()}});
    if(r.ok) fillSessionConfig(await r.json());
  }catch(err){}
}

// 全双工开关(2026-10-12 恢复):只作用于当前会话,不写持久配置——默认状态
// 由后台项目配置管理;新会话 attach 后服务端推 ctrl.duplex_state 对齐显示。
async function saveDuplexToggle(){
  var sel=id('agDuplex');
  if(!sel) return;
  var enabled=(sel.value!=='off');
  sessionDuplexOn=enabled;
  try{
    if(ws && ws.readyState===WebSocket.OPEN && protoSession){
      ws.send(JSON.stringify({
        type:'ctrl.duplex',
        trace_id:protoSession.trace_id,
        session_id:protoSession.session_id,
        enabled:enabled,
        ts_ms:Date.now()
      }));
      sysMsg(enabled?'全双工对话已开启（仅本次会话）':'全双工已关闭：仅进行语音识别出字（仅本次会话）');
    }else{
      sysMsg(enabled?'新会话将按项目默认状态开启全双工':'当前还未连接语音，会话建立后按项目默认状态开启');
    }
  }catch(err){
    sel.value=sessionDuplexOn?'on':'off';
    sysMsg('切换失败：'+err.message);
  }
}

function _pmMax(){ return (_agCfg&&_agCfg.limits&&_agCfg.limits.instructions)||6000; }

    headers:{'Content-Type':'application/json'},

function id(x){ return document.getElementById(x); }
function log(){ return id('log'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Key 保存后顺手重载小歌设置:首次输入 Key 时 loadAgentConfig 已 401 过,
// 这里补上,下拉框/当前人设立即出现。更换 Key 必须先断开旧会话，
// 临时性格/音色不跨 API Key 复用。
var _loadedSessionApiKey='';
function onApiKeySaved(){
  var next=getRuoyiApiKey();
  if(_loadedSessionApiKey && next!==_loadedSessionApiKey && activeAttempt){
    stopVoice();
  }
  saveRuoyiApiKey();
  _loadedSessionApiKey=next;
  var hint=id('sessionConfigHint');
  if(hint){ hint.className='fb-hint'; hint.textContent='API Key 已切换，请重新建立会话'; }
  loadAgentConfig();
}

function initPage(){
  var apiKeyInput=id('apiKeyInput');
  apiKeyInput.value=loadRuoyiApiKey();
  _loadedSessionApiKey=apiKeyInput.value.trim();
  apiKeyInput.addEventListener('change', onApiKeySaved);
  apiKeyInput.addEventListener('blur', onApiKeySaved);
  loadAgentConfig();
  id('spkBtn').style.display='flex';
  id('spkBtn').title='连接语音通话';
  id('sbVoice').textContent='Voice: disconnected';
  id('manualInput').addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendManualText();
    }
  });
  // 完整提示词弹框:计数实时更新;Esc/点遮罩空白处关闭(有改动先确认)
  var pmText=id('pmText');
  if(pmText) pmText.addEventListener('input', _pmUpdateCount);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ closePromptModal(true); closePersonaModal(true); }
  });
  var promptMask=id('promptMask');
  if(promptMask) promptMask.addEventListener('click', function(e){
    if(e.target===id('promptMask')) closePromptModal(true);
  });
  // 性格预设弹框:同款 Esc/遮罩关闭(有改动先确认;Esc 在上面统一挂了)
  var personaMask=id('personaMask');
  if(personaMask) personaMask.addEventListener('click', function(e){
    if(e.target===id('personaMask')) closePersonaModal(true);
  });
  sysMsg('点击通话按钮连接浏览器麦克风和播放声音');
}

initPage();
