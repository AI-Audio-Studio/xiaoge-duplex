# 仅约束"本项目自己写的代码"的额外规范(见 docs/project/CODE_GUIDELINES.md)。
# 继承根 pyproject.toml 的基础设置(line-length=100 等),再叠加复杂度/规模规则。
# 不影响 `make check`(那条对全仓用 pyproject 的宽松规则,母体 livekit-* 照常通过)。
extend = "pyproject.toml"

[lint]
extend-select = ["C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

# 历史挂账改为**函数级 `# noqa`**(打在具体超标函数的 def 行),不在此做整文件豁免——
# 否则同文件新写的超标函数也会漏放("只拦新增"失效)。集中台账见 CODE_GUIDELINES.md §5,
# 审计:grep -rn noqa $(cat ourcode.txt)。

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-statements = 50
max-branches = 12
max-returns = 6
